# Added by the swarm-verify rollout. Verifies each pull request's head in a network-disabled
# container, signs the verdict as a GitHub attestation and posts one comment bound to the head.
# Pinned by full commit; the tag it corresponds to is in the comment beside the pin.
name: swarm-verify
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
  id-token: write
  attestations: write
  artifact-metadata: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: moonrunnerkc/swarm-verify@7e9bad39a2eff768681e1d4c7393295ecb3e70c4 # v1.0.0-rc.5
        with:
          install: true
